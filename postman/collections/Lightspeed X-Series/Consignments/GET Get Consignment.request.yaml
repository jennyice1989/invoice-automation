$kind: http-request
url: '{{baseUrl}}/consignments/{{consignment_id}}'
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", function () {
          pm.response.to.have.status(200);
      });
      pm.test("Response has data object with id field", function () {
          const json = pm.response.json();
          pm.expect(json).to.have.property("data");
          pm.expect(json.data).to.be.an("object");
          pm.expect(json.data).to.have.property("id");
      });
      pm.test("data.status is a valid consignment status", function () {
          const json = pm.response.json();
          pm.expect(["OPEN", "SENT", "DISPATCHED", "RECEIVED"]).to.include(json.data.status);
      });
    language: text/javascript
order: 700
