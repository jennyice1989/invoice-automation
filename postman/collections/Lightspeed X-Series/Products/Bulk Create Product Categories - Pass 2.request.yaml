$kind: http-request
url: 'https://{{domain_prefix}}.retail.lightspeed.app/api/2026-04/product_categories/bulk'
method: POST
headers:
  Authorization: 'Bearer {{personal_token}}'
  Content-Type: application/json
  Accept: application/json
body:
  type: json
  content: |-
    {
      "categories": [
        { "name": "Fish / Freshwater",   "parent_id": "{{cat_id_livestock}}" },
        { "name": "Fish / Saltwater",    "parent_id": "{{cat_id_livestock}}" },
        { "name": "Invertebrates",       "parent_id": "{{cat_id_livestock}}" },
        { "name": "Corals",              "parent_id": "{{cat_id_livestock}}" },
        { "name": "Plants",              "parent_id": "{{cat_id_livestock}}" },
        { "name": "Reptiles",            "parent_id": "{{cat_id_livestock}}" },
        { "name": "Small Animals",       "parent_id": "{{cat_id_livestock}}" },

        { "name": "Aquariums",           "parent_id": "{{cat_id_aquarium_equipment}}" },
        { "name": "Filtration",          "parent_id": "{{cat_id_aquarium_equipment}}" },
        { "name": "Pumps & Flow",        "parent_id": "{{cat_id_aquarium_equipment}}" },
        { "name": "Lighting",            "parent_id": "{{cat_id_aquarium_equipment}}" },
        { "name": "Heating & Cooling",   "parent_id": "{{cat_id_aquarium_equipment}}" },
        { "name": "RO/DI & Water Systems", "parent_id": "{{cat_id_aquarium_equipment}}" },
        { "name": "CO2 Systems",         "parent_id": "{{cat_id_aquarium_equipment}}" },

        { "name": "Water Care",          "parent_id": "{{cat_id_aquarium_supplies}}" },
        { "name": "Fish Food",           "parent_id": "{{cat_id_aquarium_supplies}}" },
        { "name": "Aquascaping",         "parent_id": "{{cat_id_aquarium_supplies}}" },
        { "name": "Maintenance",         "parent_id": "{{cat_id_aquarium_supplies}}" },

        { "name": "Habitat Equipment",   "parent_id": "{{cat_id_reptile_supplies}}" },
        { "name": "Reptile Care",        "parent_id": "{{cat_id_reptile_supplies}}" },
        { "name": "Reptile Food",        "parent_id": "{{cat_id_reptile_supplies}}" },

        { "name": "Habitat",             "parent_id": "{{cat_id_small_animal_supplies}}" },
        { "name": "Food & Treats",       "parent_id": "{{cat_id_small_animal_supplies}}" },
        { "name": "Accessories",         "parent_id": "{{cat_id_small_animal_supplies}}" }
      ]
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      // ── Pass 2 post-response script ──────────────────────────────────────
      // Saves the API-assigned IDs for all mid-level categories to environment
      // variables so that Pass 3 can reference them as parent_id values.

      pm.test("Status is 2xx", function () {
        pm.expect(pm.response.code).to.be.within(200, 299);
      });

      pm.test("Response is JSON", function () {
        pm.expect(pm.response.headers.get("Content-Type")).to.include("json");
      });

      if (!pm.response.headers.get("Content-Type")?.includes("json")) {
        console.error("Non-JSON response – first 200 chars:", pm.response.text().substring(0, 200));
        return;
      }

      const res = pm.response.json();
      const created = Array.isArray(res) ? res : (res.categories || []);

      const nameToId = {};
      for (const cat of created) {
        if (cat.name && cat.id) nameToId[cat.name] = cat.id;
      }

      // Mid-level categories created in Pass 2
      const mids = [
        { envKey: "cat_id_fish_freshwater",      name: "Fish / Freshwater" },
        { envKey: "cat_id_fish_saltwater",       name: "Fish / Saltwater" },
        { envKey: "cat_id_invertebrates",        name: "Invertebrates" },
        { envKey: "cat_id_corals",               name: "Corals" },
        { envKey: "cat_id_plants",               name: "Plants" },
        { envKey: "cat_id_reptiles",             name: "Reptiles" },
        { envKey: "cat_id_small_animals",        name: "Small Animals" },
        { envKey: "cat_id_aquariums",            name: "Aquariums" },
        { envKey: "cat_id_filtration",           name: "Filtration" },
        { envKey: "cat_id_pumps_flow",           name: "Pumps & Flow" },
        { envKey: "cat_id_lighting",             name: "Lighting" },
        { envKey: "cat_id_heating_cooling",      name: "Heating & Cooling" },
        { envKey: "cat_id_rodi_water_systems",   name: "RO/DI & Water Systems" },
        { envKey: "cat_id_co2_systems",          name: "CO2 Systems" },
        { envKey: "cat_id_water_care",           name: "Water Care" },
        { envKey: "cat_id_fish_food",            name: "Fish Food" },
        { envKey: "cat_id_aquascaping",          name: "Aquascaping" },
        { envKey: "cat_id_maintenance",          name: "Maintenance" },
        { envKey: "cat_id_habitat_equipment",    name: "Habitat Equipment" },
        { envKey: "cat_id_reptile_care",         name: "Reptile Care" },
        { envKey: "cat_id_reptile_food",         name: "Reptile Food" },
        { envKey: "cat_id_habitat",              name: "Habitat" },
        { envKey: "cat_id_food_treats",          name: "Food & Treats" },
        { envKey: "cat_id_accessories",          name: "Accessories" }
      ];

      let saved = 0;
      for (const { envKey, name } of mids) {
        if (nameToId[name]) {
          pm.environment.set(envKey, nameToId[name]);
          saved++;
          console.log(`✅ Saved ${envKey} = ${nameToId[name]}`);
        } else {
          console.warn(`⚠️  No id found for "${name}" in response`);
        }
      }

      pm.test(`All 24 mid-level category IDs saved to environment (got ${saved}/24)`, function () {
        pm.expect(saved).to.equal(24);
      });

      // ── Visualiser ───────────────────────────────────────────────────────
      const rows = mids.map(({ envKey, name }) => {
        const id = nameToId[name] || '<not returned>';
        const ok = !!nameToId[name];
        return `<tr>
          <td style="padding:5px 10px;font-weight:600;">${name}</td>
          <td style="padding:5px 10px;font-family:monospace;font-size:12px;color:#555;">${id}</td>
          <td style="padding:5px 10px;text-align:center;">${ok ? '✅' : '❌'}</td>
          <td style="padding:5px 10px;font-family:monospace;font-size:11px;color:#888;">{{${envKey}}}</td>
        </tr>`;
      }).join('');

      const template = `
      <html><body style="font-family:sans-serif;padding:16px;color:#222;background:#fff;">
        <h2 style="margin-bottom:4px;">📦 Pass 2 – Mid-Level Categories Created</h2>
        <p style="color:#555;margin-top:0;">IDs saved to environment. Run <strong>Pass 3</strong> next to create all leaf categories.</p>
        <table style="border-collapse:collapse;width:100%;font-size:13px;">
          <thead>
            <tr style="background:#f0f4ff;">
              <th style="padding:5px 10px;text-align:left;">Category</th>
              <th style="padding:5px 10px;text-align:left;">API ID</th>
              <th style="padding:5px 10px;">Saved</th>
              <th style="padding:5px 10px;text-align:left;">Env Variable</th>
            </tr>
          </thead>
          <tbody>{{rows}}</tbody>
        </table>
      </body></html>`;

      pm.visualizer.set(template, { rows });
