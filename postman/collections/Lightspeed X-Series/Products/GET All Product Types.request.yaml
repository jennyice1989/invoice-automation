$kind: http-request
url: '{{baseUrl}}/product_types'
method: GET
params:
  - key: page_size
    value: '100'
    description: Number of product types to return per page
    enabled: true
  - key: after
    value: ''
    description: Cursor for pagination (from version.max of previous response)
    enabled: false
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status 200", function () {
          pm.response.to.have.status(200);
      });
      pm.test("Returns product types array", function () {
          const json = pm.response.json();
          const types = json.data || json;
          pm.expect(types).to.be.an("array");
      });
    language: text/javascript
visualizerScript: |-
  const json = pm.response.json();
  const productTypes = (json.data !== undefined ? json.data : json) || [];

  const columns = productTypes.length > 0 ? Object.keys(productTypes[0]) : [];

  const headerCells = columns.map(col =>
    `<th>${col}</th>`
  ).join('');

  const bodyRows = productTypes.map(item => {
    const cells = columns.map(col => {
      const val = item[col];
      const display = val === null || val === undefined ? '' : (typeof val === 'object' ? JSON.stringify(val) : val);
      return `<td>${display}</td>`;
    }).join('');
    return `<tr>${cells}</tr>`;
  }).join('');

  const template = `
    <style>
      body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; padding: 20px; background: #f5f7fa; margin: 0; }
      h2 { color: #1a1a2e; margin-bottom: 16px; font-size: 18px; font-weight: 600; }
      .badge { display: inline-block; background: #e0e7ff; color: #4338ca; border-radius: 12px; padding: 2px 10px; font-size: 12px; font-weight: 600; margin-left: 8px; vertical-align: middle; }
      .empty { color: #9ca3af; font-style: italic; padding: 24px 0; font-size: 14px; }
      .table-wrap { overflow-x: auto; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
      table { border-collapse: collapse; width: 100%; background: #fff; }
      th { background: #4f46e5; color: #fff; padding: 11px 16px; text-align: left; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; white-space: nowrap; }
      td { padding: 10px 16px; border-bottom: 1px solid #f0f0f0; font-size: 13px; color: #374151; word-break: break-word; max-width: 260px; }
      tr:last-child td { border-bottom: none; }
      tr:nth-child(even) td { background: #fafbff; }
      tr:hover td { background: #eef2ff; }
    </style>
    <h2>All Product Types <span class="badge">${productTypes.length}</span></h2>
    ${productTypes.length === 0
      ? '<p class="empty">No product types found.</p>'
      : `<div class="table-wrap"><table>
           <thead><tr>${headerCells}</tr></thead>
           <tbody>${bodyRows}</tbody>
         </table></div>`
    }
  `;

  pm.visualizer.set(template, { data: productTypes });