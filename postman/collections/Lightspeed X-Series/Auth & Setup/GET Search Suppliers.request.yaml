$kind: http-request
url: "{{baseUrl}}/suppliers?page_size=200"
method: GET
queryParams:
  page_size: "200"
scripts:
  - type: beforeRequest
    code: |-
      // Filter suppliers by name — set the variable 'supplier_name_filter' before running
      const nameFilter = pm.variables.get("supplier_name_filter") || "";
      pm.variables.set("_supplier_name_filter", nameFilter);
    language: text/javascript
order: 3000
