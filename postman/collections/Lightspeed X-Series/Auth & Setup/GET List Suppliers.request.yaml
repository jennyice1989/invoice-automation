$kind: http-request
url: "{{baseUrl}}/suppliers?page_size=200"
method: GET
queryParams:
  page_size: "200"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status 200 OK", function () {
          pm.response.to.have.status(200);
      });
      pm.test("Response has data array", function () {
          const json = pm.response.json();
          pm.expect(json).to.have.property("data");
          pm.expect(json.data).to.be.an("array");
      });
      // Save first supplier_id for use in other requests
      const suppliers = pm.response.json().data;
      if (suppliers && suppliers.length > 0) {
          pm.collectionVariables.set("supplier_id", suppliers[0].id);
          console.log("supplier_id set to:", suppliers[0].id);
      }
    language: text/javascript
order: 200
