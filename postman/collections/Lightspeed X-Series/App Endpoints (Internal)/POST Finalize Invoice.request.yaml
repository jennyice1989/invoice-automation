$kind: http-request
url: "{{appUrl}}/invoices/finalize"
method: POST
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "invoice_id": "{{invoice_id}}",
      "outlet_id": "{{outlet_id}}",
      "supplier_id": "{{supplier_id}}",
      "receive_immediately": false
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", function () {
          pm.response.to.have.status(200);
      });
      pm.test("Response has consignment_id field", function () {
          const json = pm.response.json();
          pm.expect(json).to.have.property("consignment_id");
      });
      const json = pm.response.json();
      if (json && json.consignment_id) {
          pm.collectionVariables.set("consignment_id", json.consignment_id);
          console.log("consignment_id set to:", json.consignment_id);
      }
    language: text/javascript
order: 600
