$kind: http-request
url: "{{appUrl}}/invoices/{{invoice_id}}"
method: GET
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", function () {
          pm.response.to.have.status(200);
      });
      pm.test("Response has lines array with length > 0", function () {
          const json = pm.response.json();
          pm.expect(json).to.have.property("lines");
          pm.expect(json.lines).to.be.an("array");
          pm.expect(json.lines.length).to.be.above(0);
      });
      pm.test("Response has status field", function () {
          const json = pm.response.json();
          pm.expect(json).to.have.property("status");
      });
    language: text/javascript
order: 500
