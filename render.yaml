databases:
  - name: invoice-importer-db
    plan: basic-1gb
    databaseName: invoice_importer
    user: invoice_importer

services:
  - type: web
    name: lightspeed-invoice-importer
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: LIGHTSPEED_DOMAIN_PREFIX
        sync: false
      - key: LIGHTSPEED_PERSONAL_TOKEN
        sync: false
      - key: LIGHTSPEED_DEFAULT_OUTLET_ID
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: "gpt-5.5"
      - key: APP_PASSWORD
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: invoice-importer-db
          property: connectionString
      - key: PYTHON_VERSION
        value: "3.12.5"
