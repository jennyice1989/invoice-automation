services:
  - type: web
    name: lightspeed-invoice-importer
    env: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: LIGHTSPEED_DOMAIN_PREFIX
        sync: false
      - key: LIGHTSPEED_PERSONAL_TOKEN
        sync: false
      - key: LIGHTSPEED_DEFAULT_OUTLET_ID
        sync: false
      - key: PYTHON_VERSION
        value: "3.12.5"
